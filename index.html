<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1016"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Organisationsplan"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Organisationsplan</title><link rel="stylesheet" href="style.css?v=0213diag2"></head><body><main id="app"><p>Lade Organisationsplan …</p></main><nav id="tabs"><button data-tab="start">⌂<small>Start</small></button><button data-tab="bereiche">▦<small>Bereiche</small></button><button data-tab="personen">♙<small>Personen</small></button><button data-tab="suche">⌕<small>Suche</small></button><button data-tab="mehr">⋯<small>Mehr</small></button></nav><input type="file" id="excelFile" accept=".xlsx" hidden><input type="file" id="backupFile" accept=".json,application/json" hidden><script>
(function(){
 var loaded={jszip:false,excel:false,app:false},ready=false,reported=false;
 function show(code){
  if(ready||reported)return;reported=true;
  var app=document.getElementById('app');if(!app)return;
  var safe=String(code).replace(/[^a-zA-Z0-9 ._:\-]/g,'').slice(0,160);
  app.innerHTML='<section style="padding:24px;max-width:560px;margin:auto;font:16px/1.5 system-ui"><h1>Organisationsplan: Startdiagnose</h1><p>Keine Daten wurden durch diese Diagnose gelöscht.</p><p><strong>Fehlercode: '+safe+'</strong></p><p>Bitte diesen Code mitteilen. App und Website-Daten nicht löschen.</p></section>';
 }
 window.__orgplanStartupOk=function(){ready=true};
 window.__orgplanLoaded=function(name){loaded[name]=true};
 window.addEventListener('error',function(e){
  if(e.target&&e.target.tagName==='SCRIPT'){show('DATEI '+(e.target.src.split('/').pop()||'unbekannt'));return}
  show('JS '+(e.message||'unbekannt')+' ZEILE '+(e.lineno||'?'));
 },true);
 window.addEventListener('unhandledrejection',function(e){show('PROMISE '+(e.reason&&e.reason.message||'unbekannt'))});
 setTimeout(function(){if(!ready){var missing=Object.keys(loaded).filter(function(k){return !loaded[k]});show(missing.length?'NICHT GELADEN '+missing.join(','):'ALLE DATEIEN GELADEN START UNVOLLSTAENDIG')}},12000);
})();
</script><script src="jszip.min.js?v=0213diag2" defer onload="window.__orgplanLoaded('jszip')" onerror="window.__orgplanLoaded('jszip')"></script><script src="excel.js?v=0213diag2" defer onload="window.__orgplanLoaded('excel')"></script><script src="app.js?v=0213diag2" defer onload="window.__orgplanLoaded('app')"></script></body></html>
