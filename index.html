<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1016"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Organisationsplan"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Organisationsplan</title><link rel="stylesheet" href="style.css?v=0213fix1"></head><body><main id="app"><p>Lade Organisationsplan …</p></main><nav id="tabs"><button data-tab="start">⌂<small>Start</small></button><button data-tab="bereiche">▦<small>Bereiche</small></button><button data-tab="personen">♙<small>Personen</small></button><button data-tab="suche">⌕<small>Suche</small></button><button data-tab="mehr">⋯<small>Mehr</small></button></nav><input type="file" id="excelFile" accept=".xlsx" hidden><input type="file" id="backupFile" accept=".json,application/json" hidden><script>
/* Startup diagnostics: no personal data, passwords or storage contents are collected. */
(function(){
  var ready=false;
  function report(code){
    if(ready||document.getElementById('security-screen'))return;
    var app=document.getElementById('app');if(!app)return;
    app.innerHTML='<section style="padding:24px;max-width:560px;margin:auto;font:16px/1.5 system-ui"><h1>Organisationsplan konnte nicht starten</h1><p>Die vorhandenen Daten wurden nicht gelöscht.</p><p><strong>Fehlercode: '+String(code).replace(/[^a-zA-Z0-9._:-]/g,'')+'</strong></p><p>Bitte diesen Fehlercode mitteilen. App nicht löschen und keine Website-Daten zurücksetzen.</p></section>';
  }
  window.__orgplanStartupOk=function(){ready=true};
  window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){report('SCRIPT-'+(e.target.src.split('/').pop()||'unknown').split('?')[0]);return}report('JS-'+(e.message||'unknown').slice(0,100))},true);
  window.addEventListener('unhandledrejection',function(){report('PROMISE')});
  setTimeout(function(){report('TIMEOUT-12S')},12000);
})();
</script><script src="jszip.min.js?v=0213fix1" defer></script><script src="excel.js?v=0213fix1" defer></script><script src="app.js?v=0213fix1" defer></script></body></html>
